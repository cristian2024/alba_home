name: alba
description: Reloj de mesa de noche y cocina. Punto de composición de Alba, que ensambla los plugins y elige los adaptadores.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  alarm_isar: ^0.1.0
  alarm_scheduler_alarm: ^0.1.1
  core_contracts:
    git:
      url: https://github.com/cristian2024/flutter_shared.git
      path: packages/core/core_contracts
      tag_pattern: core_contracts-v{{version}}
    version: ^0.1.4
  core_di:
    git:
      url: https://github.com/cristian2024/flutter_shared.git
      path: packages/core/core_di
      tag_pattern: core_di-v{{version}}
    version: ^0.1.2
  core_events:
    git:
      url: https://github.com/cristian2024/flutter_shared.git
      path: packages/core/core_events
      tag_pattern: core_events-v{{version}}
    version: ^0.2.0
  core_ui:
    git:
      url: https://github.com/cristian2024/flutter_shared.git
      path: packages/shared/core_ui
      tag_pattern: core_ui-v{{version}}
    version: ^0.1.3
  core_utils:
    git:
      url: https://github.com/cristian2024/flutter_shared.git
      path: packages/shared/core_utils
      tag_pattern: core_utils-v{{version}}
    version: ^0.1.2
  design_system: ^0.1.1
  flutter:
    sdk: flutter
  go_router: ">=14.0.0 <17.0.0"
  plugin_alarm: ^0.1.0
  storage_isar:
    git:
      url: https://github.com/cristian2024/flutter_shared.git
      path: packages/adapters/storage_isar
      tag_pattern: storage_isar-v{{version}}
    version: ^0.3.2

dev_dependencies:
  alarm_domain: ^0.2.0
  async: ^2.11.0
  core_alarm_scheduler: ^0.1.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
