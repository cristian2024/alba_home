name: photo_frame_contract
description: API pública de las fotos para otros plugins, en Dart puro. La foto que toca mostrar ahora (CurrentPhotoQuery), que el reloj pone de fondo.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  # Solo para los tests de contrato (StreamQueue).
  async: ^2.11.0
  equatable: ^3.0.0
  # Solo para los tests de contrato de `package:photo_frame_contract/testing.dart`.
  test: ^1.28.0

dev_dependencies:
  flutter_lints: ^6.0.0
