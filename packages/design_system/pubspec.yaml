name: design_system
description: Sistema de diseño de Alba generado desde Penpot. Tokens, temas claro, oscuro y noche, Inter con cifras tabulares, iconos y componentes accesibles.
version: 0.1.3
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/OFL-Inter.txt
    - assets/LICENSE-Lucide.txt
  fonts:
    - family: AlbaIcons
      fonts:
        - asset: assets/fonts/AlbaIcons.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
