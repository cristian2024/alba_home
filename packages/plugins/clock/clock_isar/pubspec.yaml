name: clock_isar
description: Adaptador Isar del reloj. Registra NightScheduleRepository sobre storage_isar.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  clock_domain: ^0.1.0
  core_di:
    git:
      url: https://github.com/cristian2024/flutter_shared.git
      path: packages/core/core_di
      tag_pattern: core_di-v{{version}}
    version: ^0.1.2
  flutter:
    sdk: flutter
  storage_isar:
    git:
      url: https://github.com/cristian2024/flutter_shared.git
      path: packages/adapters/storage_isar
      tag_pattern: storage_isar-v{{version}}
    version: ^0.3.2

dev_dependencies:
  build_runner: ">=2.4.0 <3.0.0"
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  isar_community_generator: 3.4.1
