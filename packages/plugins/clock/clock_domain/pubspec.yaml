name: clock_domain
description: Dominio del reloj en Dart puro. El horario de noche con sus fundidos, la fase de noche en cada instante, la opacidad del degradado sobre la foto según su luminosidad y el contrato del repositorio del horario con sus tests.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  # Solo para los tests de contrato (StreamQueue).
  async: ^2.11.0
  clock_contract: ^0.1.0
  equatable: ^3.0.0
  # Solo para los tests de contrato de `package:clock_domain/testing.dart`.
  test: ^1.28.0
  wall_clock: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
