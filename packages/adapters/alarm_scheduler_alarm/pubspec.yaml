name: alarm_scheduler_alarm
description: Adaptador de core_alarm_scheduler sobre el paquete alarm. Alarmas exactas que suenan con la app cerrada y tras reiniciar, con pantalla completa.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  alarm: 5.15.0
  core_alarm_scheduler: ^0.1.0
  core_di:
    git:
      url: https://github.com/cristian2024/flutter_shared.git
      path: packages/core/core_di
      tag_pattern: core_di-v{{version}}
    version: ^0.1.2
  core_utils:
    git:
      url: https://github.com/cristian2024/flutter_shared.git
      path: packages/shared/core_utils
      tag_pattern: core_utils-v{{version}}
    version: ^0.1.2
  flutter:
    sdk: flutter
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
